<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // Apply the saved theme before first paint (light unless the user chose otherwise).
      (function () {
        try {
          var m = localStorage.getItem('truck-theme');
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563EB%27/%3E%3Cpath d=%27M6 21h14V11H6zm14-6h4l3 3v3h-7z%27 fill=%27white%27/%3E%3Ccircle cx=%2711%27 cy=%2723%27 r=%272.5%27 fill=%27white%27/%3E%3Ccircle cx=%2723%27 cy=%2723%27 r=%272.5%27 fill=%27white%27/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Compare three truck routes by the weather at each checkpoint's arrival time, load weight and travel time, and pick the safest one."
    />
    <title>Truck Weather Routing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
