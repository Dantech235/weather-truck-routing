[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-truck-routing"
version = "1.0.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "django-cors-headers>=4.4,<5.0",
    "django-redis>=5.4,<8.0",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "dj-database-url>=2.2,<4.0",
    "whitenoise>=6.7,<7.0",
    "gunicorn>=22.0",
    "polyline>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
]

# Deploy-as-source app: pip installs dependencies only, no wheel packages.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DJ", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes / arrows / ≥ in human-readable reason strings

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["polyline.*", "dj_database_url.*", "respx.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.coverage.run]
branch = true
source = ["risk", "trips", "core"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
